name: Qwen3-VL-4B CPU OCR trial
on:
  push:
    branches: [codex/qwen3-vl-ocr-test]
    paths:
      - scripts/test_qwen_ocr.py
      - .github/workflows/test-qwen-ocr.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qwen-ocr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      LLAMA_COMMIT: 08ffba21e5c2f1728b6b405c05ff3913f65706d4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record hardware and install image dependency
        run: |
          mkdir -p output
          lscpu > output/cpu.txt
          free -m > output/memory.txt
          df -h > output/disk.txt
          python -m pip install Pillow==11.3.0
      - name: Build pinned llama.cpp CPU server
        run: |
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin "$LLAMA_COMMIT"
          git -C llama.cpp checkout --detach FETCH_HEAD
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build llama.cpp/build --target llama-server -j 4
      - name: Read three release screenshots on CPU
        run: python -u scripts/test_qwen_ocr.py
      - name: Upload comparison and diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-vl-4b-cpu-trial-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: error
